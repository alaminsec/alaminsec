<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_X | ALAMIN</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22ALAMIN_VAULT%22,%22short_name%22:%22VAULT%22,%22start_url%22:%22index.html%22,%22display%22:%22standalone%22,%22background_color%22:%22#000000%22,%22theme_color%22:%22#00ff00%22}">

    <link href='https://fonts.googleapis.com/css?family=Orbitron:900' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: black; font-family: 'Orbitron', sans-serif; color: #0F0; }
        #c { position: fixed; top: 0; left: 0; z-index: -1; }
        .page { position: relative; z-index: 1; height: 100vh; width: 100vw; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; animation: flash 0.4s ease-out; overflow-y: auto; }
        @keyframes flash { 0% { background: rgba(0, 255, 0, 0.2); opacity: 0; } 100% { background: transparent; opacity: 1; } }
        .active { display: flex; }
        h1 { color: #FFF; font-size: 50px; font-weight: 900; text-transform: uppercase; margin: 20px 0; line-height: 0.9; letter-spacing: 5px; text-shadow: 0 0 10px #0f0, 0 0 20px #0f0; }
        .input-group { width: 85%; max-width: 320px; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .pass-wrapper { position: relative; width: 100%; }
        input { width: 100%; padding: 15px; margin: 8px 0; background: rgba(0, 0, 0, 0.8); border: 1px solid #0F0; color: #0F0; outline: none; font-size: 16px; text-align: center; font-family: monospace; box-sizing: border-box; }
        .toggle-pass { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #0F0; cursor: pointer; font-size: 18px; z-index: 10; }
        button { padding: 12px 25px; background: transparent; border: 1px solid #0F0; color: #0F0; font-family: 'Orbitron', sans-serif; cursor: pointer; letter-spacing: 2px; margin-top: 10px; transition: 0.3s; width: 100%; box-sizing: border-box; }
        button:hover { background: #0F0; color: #000; }
        .exit-btn { border-color: #ff0000; color: #ff0000; }
        #status-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 500; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .tick-circle { width: 80px; height: 80px; border: 4px solid #0F0; border-radius: 50%; display: flex; justify-content: center; align-items: center; animation: scaleIn 0.3s ease-out; }
        .tick-mark { width: 40px; height: 20px; border-left: 5px solid #0F0; border-bottom: 5px solid #0F0; transform: rotate(-45deg) translate(5px, -5px); animation: drawTick 0.5s ease-out forwards; }
        @keyframes scaleIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes drawTick { 0% { width: 0; height: 0; opacity: 0; } 100% { width: 40px; height: 20px; opacity: 1; } }
        #del-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 400; display: none; justify-content: center; align-items: center; }
        .modal-box { width: 85%; max-width: 300px; padding: 25px; border: 1px solid #0F0; background: black; text-align: center; }
        #db-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 100; display: none; flex-direction: column; align-items: center; overflow-y: auto; padding-bottom: 30px; }
        .db-header { width: 100%; padding: 15px 0; background: black; position: sticky; top: 0; z-index: 110; display: flex; flex-direction: column; align-items: center; border-bottom: 1px solid #0F0; }
        .db-header-btns { display: flex; gap: 10px; width: 90%; max-width: 400px; }
        .data-card { width: 85%; max-width: 400px; border: 1px solid #0F0; padding: 15px; margin-top: 15px; background: rgba(0, 255, 0, 0.05); text-align: left; box-sizing: border-box; }
        #db-btn-top { position: fixed; top: 15px; right: 15px; z-index: 50; width: auto; font-size: 10px; padding: 5px 10px; display: none; }
        @media (max-width: 600px) { h1 { font-size: 35px; } }
    </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="status-overlay">
    <div class="tick-circle"><div class="tick-mark"></div></div>
    <p id="status-text" style="margin-top: 20px; letter-spacing: 5px; color: #0F0; font-size: 20px;"></p>
</div>

<div id="del-modal">
    <div class="modal-box">
        <p style="font-size: 14px; margin-bottom: 15px; letter-spacing: 2px;">AUTHORIZE_DELETE</p>
        <div class="pass-wrapper"><input type="password" id="del-pass-input"></div>
        <button onclick="verifyDelete()">CONFIRM</button>
        <button onclick="closeModal()" style="border-color: #555; color: #555; margin-top: 10px;">CANCEL</button>
    </div>
</div>

<div id="setup-page" class="page">
    <h1>SET MASTER KEY</h1>
    <div class="input-group">
        <input type="password" id="new-key" placeholder="CREATE PASSWORD">
        <button onclick="saveMasterKey()">INITIALIZE SYSTEM</button>
    </div>
</div>

<div id="lock-page" class="page">
    <div class="input-group">
        <div class="pass-wrapper">
            <input type="password" id="master-key" oninput="checkAuth()" placeholder="SYSTEM_KEY">
        </div>
    </div>
</div>

<div id="welcome-page" class="page">
    <h1 id="welcome-text">WELCOME<br>MOHAMMAD<br>ALAMIN</h1>
    <div class="input-group"><button onclick="nav('vault-page')">ENTER_SYSTEM</button></div>
</div>

<div id="vault-page" class="page">
    <button id="db-btn-top" onclick="openDB()">DATABASE</button>
    <div class="input-group">
        <input type="text" id="t1" placeholder="TITLE">
        <input type="text" id="u1" placeholder="USERNAME">
        <div class="pass-wrapper">
            <input type="password" id="p1" placeholder="PASSWORD">
            <i class="fa-solid fa-eye toggle-pass" onclick="togglePass('p1', this)"></i>
        </div>
        <button onclick="saveData()">SECURE</button>
        <button class="exit-btn" onclick="exitApp()">EXIT</button>
    </div>
</div>

<div id="db-overlay">
    <div class="db-header">
        <div class="db-header-btns">
            <button onclick="closeDB()" style="font-size: 10px; flex:1;">BACK</button>
            <button onclick="exportData('txt')" style="font-size: 10px; flex:1; border-color: cyan; color: cyan;">TXT</button>
            <button onclick="exportData('html')" style="font-size: 10px; flex:1; border-color: orange; color: orange;">HTML</button>
        </div>
    </div>
    <div id="db-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
</div>

<script>
    var currentDelIndex = null;

    // --- INITIALIZE ---
    window.onload = function() {
        if (!localStorage.getItem('alamin_master_key')) {
            nav('setup-page');
        } else {
            nav('lock-page');
        }
    }

    function saveMasterKey() {
        const key = document.getElementById('new-key').value;
        if (key.length < 4) { alert("Minimum 4 chars!"); return; }
        localStorage.setItem('alamin_master_key', key);
        showStatus("KEY_SET");
        setTimeout(() => nav('lock-page'), 1000);
    }

    function checkAuth() {
        const inputKey = document.getElementById('master-key').value;
        const savedKey = localStorage.getItem('alamin_master_key');
        if (inputKey === savedKey) nav('welcome-page');
    }

    // Matrix BG logic
    var c = document.getElementById("c"); var ctx = c.getContext("2d");
    function resize() { c.height = window.innerHeight; c.width = window.innerWidth; }
    window.onresize = resize; resize();
    var matrix = "01010101ABCDEFGHIKLMNOPQRSTVXYZ".split("");
    var font_size = 10; var columns = c.width / font_size; var drops = Array(Math.floor(columns)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = "#0F0"; ctx.font = font_size + "px monospace"; 
        for(var i=0; i<drops.length; i++){
            var char = matrix[Math.floor(Math.random()*matrix.length)];
            ctx.fillText(char, i*font_size, drops[i]*font_size);
            if(drops[i]*font_size > c.height && Math.random() > 0.985) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 65);

    function nav(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'vault-page') document.getElementById('db-btn-top').style.display = 'block';
    }

    function togglePass(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text"; icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            input.type = "password"; icon.classList.replace("fa-eye-slash", "fa-eye");
        }
    }

    function showStatus(text) {
        document.getElementById('status-text').innerText = text;
        document.getElementById('status-overlay').style.display = 'flex';
        setTimeout(() => { document.getElementById('status-overlay').style.display = 'none'; }, 1500);
    }

    function saveData() {
        const t = document.getElementById('t1').value, u = document.getElementById('u1').value, p = document.getElementById('p1').value;
        if(!t || !u || !p) return;
        let db = JSON.parse(localStorage.getItem('alamin_db')) || [];
        db.push({t, u, p});
        localStorage.setItem('alamin_db', JSON.stringify(db));
        showStatus("SECURED");
        ['t1','u1','p1'].forEach(i => document.getElementById(i).value = '');
    }

    function openDB() {
        document.getElementById('db-overlay').style.display = 'flex';
        const content = document.getElementById('db-content'); content.innerHTML = '';
        const db = JSON.parse(localStorage.getItem('alamin_db')) || [];
        db.forEach((item, i) => {
            content.innerHTML += `<div class="data-card"><strong>[ ${item.t} ]</strong><br>U: ${item.u}<br>P: ${item.p}<br><button onclick="openDelModal(${i})" style="width:auto; font-size:10px; border-color:red; color:red; margin-top:8px; padding: 2px 8px;">DEL</button></div>`;
        });
    }

    function exportData(type) {
        const db = JSON.parse(localStorage.getItem('alamin_db')) || [];
        if(db.length === 0) return;
        let content = "";
        if(type === 'txt') {
            db.forEach(item => content += `TITLE: ${item.t}\nUSER: ${item.u}\nPASS: ${item.p}\n-------------------\n`);
        } else {
            content = `<html><body style="background:#000;color:#0f0;font-family:monospace;"><h2>VAULT BACKUP</h2>`;
            db.forEach(item => content += `<div style="border:1px solid #0f0;padding:10px;margin:10px;"><b>${item.t}</b><br>U: ${item.u}<br>P: ${item.p}</div>`);
            content += `</body></html>`;
        }
        const blob = new Blob([content], { type: type === 'txt' ? 'text/plain' : 'text/html' });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "BACKUP."+type; a.click();
    }

    function openDelModal(index) { currentDelIndex = index; document.getElementById('del-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('del-modal').style.display = 'none'; document.getElementById('del-pass-input').value = ''; }

    function verifyDelete() {
        const savedKey = localStorage.getItem('alamin_master_key');
        if(document.getElementById('del-pass-input').value === savedKey) {
            let db = JSON.parse(localStorage.getItem('alamin_db'));
            db.splice(currentDelIndex, 1);
            localStorage.setItem('alamin_db', JSON.stringify(db));
            closeModal(); showStatus("DONE"); openDB();
        } else { alert("WRONG_KEY"); }
    }

    function closeDB() { document.getElementById('db-overlay').style.display = 'none'; }
    function exitApp() { if(confirm("EXIT?")) window.location.reload(); }
</script>
</body>
</html>
